spring.application.name=api-gateway
# Keycloak owns :8080 in ERP standard — gateway defaults to 8090
server.port=${SERVER_PORT:8090}

# Upstream services
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
crm.service.url=${CRM_SERVICE_URL:http://localhost:8082}

# Keycloak issuer (must match token "iss" — ERP standard)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/erp}

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${auth.service.url}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=crm-service
spring.cloud.gateway.routes[1].uri=${crm.service.url}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/**

spring.cloud.gateway.routes[2].id=crm-actuator
spring.cloud.gateway.routes[2].uri=${crm.service.url}
spring.cloud.gateway.routes[2].predicates[0]=Path=/actuator/prometheus

# Request body size (codec) — default 2MB
spring.codec.max-in-memory-size=${GATEWAY_MAX_BODY_SIZE:2MB}
gateway.request.max-content-length-bytes=${GATEWAY_MAX_CONTENT_LENGTH:2097152}

# Edge JWT validation against Keycloak (CRM still validates)
gateway.security.jwt.enabled=${GATEWAY_JWT_ENABLED:true}

# Redis optional (legacy blacklist unused in Keycloak mode)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# In-memory rate limiting (per client IP)
gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
gateway.rate-limit.requests-per-minute=${GATEWAY_RATE_LIMIT_RPM:120}

# Production CORS — comma-separated origins (not *)
gateway.cors.allowed-origins=${GATEWAY_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
gateway.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
gateway.cors.allowed-headers=Authorization,Content-Type,X-Correlation-Id,Accept,Origin
gateway.cors.allow-credentials=true

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
info.app.name=api-gateway
info.app.description=INSA ERP API Gateway (Keycloak JWT)
info.app.version=0.0.1-SNAPSHOT
